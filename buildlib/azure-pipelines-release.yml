# See https://aka.ms/yaml
# This pipeline to be run on tags creation

trigger: none
pr:
  - io_offload

resources:
  containers:
    - container: centos8
      image: rdmz-harbor.rdmz.labs.mlnx/ucx/centos8:1

stages:
  - stage: Build
    jobs:
      - job: CheckRelease
        container: centos8
        pool:
          name: MLNX
          demands:
          - ucx_docker -equals yes
        steps:
          - checkout: self
            fetchDepth: 100
            clean: true
          - bash: ./autogen.sh
            displayName: Setup autotools

          - bash: |
              set -eE
              gcc --version
              mkdir pkg-build
              cd pkg-build
              ../contrib/configure-release --with-java=no --prefix=$(Build.Repository.LocalPath)/install
              make -s -j `nproc`
              make install
            displayName: Build

